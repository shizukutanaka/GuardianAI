name: Test Runner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest cryptography
      - run: python src/test_auto.py --all
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: src/test_reports/
          retention-days: 30
