# Release pipeline - tag push builds the distributable artifacts and
# attaches them to a GitHub Release, so `git tag v1.0.0 && git push
# --tags` is the whole release ceremony.
#
# Artifacts per OS: shieldai-<os> (+ shieldai.exe on Windows),
# SHA256SUMS.txt, sbom.cyclonedx.json.
# Unsigned binaries ship with their hash for manual verification -
# code signing can be added later without changing the flow.
name: release
on:
  push:
    tags: ["v*"]

# the publish step creates a release - the default token is read-only
# and failed with 'Resource not accessible by integration' on the
# first real run.
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests gate the release
        run: python src/test_auto.py
      - name: Build exe + sums + sbom
        run: |
          python scripts/build_exe.py
          python scripts/gen_sbom.py
      - name: Installer (Windows only)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          iscc scripts/shieldai.iss
      - name: Name artifacts per-OS
        # all three jobs built 'dist/shieldai*' - uploading the same
        # filename to one release means last-writer-wins and a platform
        # silently disappears (proven by the first real run: only one
        # 'shieldai' asset existed). Rename before publish.
        shell: bash
        run: |
          cd dist
          case "$RUNNER_OS" in
            Windows) mv shieldai.exe shieldai-windows.exe
                     mv SHA256SUMS.txt SHA256SUMS-windows.txt ;;
            macOS)   mv shieldai shieldai-macos
                     mv SHA256SUMS.txt SHA256SUMS-macos.txt ;;
            Linux)   mv shieldai shieldai-linux
                     mv SHA256SUMS.txt SHA256SUMS-linux.txt ;;
          esac
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shieldai-*
            dist/ShieldAI-Setup-*.exe
            dist/SHA256SUMS-*.txt
            dist/sbom.cyclonedx.json
          generate_release_notes: true
